version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: varejobi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: varejobi
      POSTGRES_USER: varejobi
      POSTGRES_PASSWORD: varejobi_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varejobi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: varejobi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass varejobi_dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "varejobi_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: varejobi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://varejobi:varejobi_dev@postgres:5432/varejobi
      REDIS_URL: redis://:varejobi_dev@redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-varejobi-uploads-dev}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./src:/app/src
      - ./dist:/app/dist
      - ./server.ts:/app/server.ts
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json

volumes:
  pgdata:
